[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hcicontroller"
version = "1.0.0"
description = "Host-side Python HCI and BLE validation library for HciController"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "pyusb>=1.2",
]

[project.urls]
Repository = "https://github.com/IOsonata/HciController"

[tool.setuptools]
packages = ["hcicontroller"]
